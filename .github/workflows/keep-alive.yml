# Keeps the DigiSub Hub site awake on Render's free plan.
# Render free sleeps after 15 minutes idle; a ping every 10 minutes
# keeps it up 24/7. This repo is public on purpose: GitHub Actions
# minutes are unlimited for public repos (a private repo only gets
# 2,000 free minutes/month, which a 10-minute ping would exhaust).
# Nothing sensitive lives here — it only curls a public URL.
name: Keep DigiSub Hub awake

on:
  schedule:
    # Every 10 min, offset 2 min past the hour so runs don't land on
    # the top of the hour, when GitHub's scheduler is busiest and
    # scheduled runs are most often delayed or dropped.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 https://digisub-hub.onrender.com/api/health
